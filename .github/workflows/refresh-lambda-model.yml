name: Refresh Lambda Model

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["On-Demand Model Retraining"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: lambda-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::487192702559:role/GovernmentFraudGitHubActionsRole
          aws-region: eu-central-1

      - name: Refresh Lambda configuration
        run: |
          CURRENT_VARS=$(aws lambda get-function-configuration \
            --function-name government-fraud-api \
            --query 'Environment.Variables' \
            --output json)

          UPDATED_VARS=$(echo "$CURRENT_VARS" | jq -c \
            --arg revision "$GITHUB_RUN_ID" \
            '.MODEL_REVISION = $revision')

          aws lambda update-function-configuration \
            --function-name government-fraud-api \
            --environment "{\"Variables\":$UPDATED_VARS}"

          aws lambda wait function-updated \
            --function-name government-fraud-api

          echo "Lambda model refresh completed successfully"

      - name: Verify authenticated REST API
        env:
          API_HEALTH_URL: https://q6chp4f4c76oyciex6f2gcictq0qjwqj.lambda-url.eu-central-1.on.aws/health
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --max-time 75 \
            --aws-sigv4 "aws:amz:eu-central-1:lambda" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            -H "X-Amz-Security-Token: $AWS_SESSION_TOKEN" \
            "$API_HEALTH_URL")

          echo "Authenticated health response: $response"
          echo "$response" | jq -e '.status == "OK"'