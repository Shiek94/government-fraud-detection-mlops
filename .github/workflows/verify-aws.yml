name: Verify AWS Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
            role-to-assume: arn:aws:iam::487192702559:role/GovernmentFraudGitHubActionsRole
            aws-region: eu-central-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: List S3 checkpoints
        run: aws s3 ls s3://government-fraud-mlops-iu-project/checkpoints/
